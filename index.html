<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>SnapNinja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #10b981;
    --accent-dark: #059669;
    --warn: #f59e0b;
    --error: #ef4444;
    --bottom-nav-h: 74px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  header {
    padding: 12px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #setupLink { color: var(--muted); font-size: 13px; text-decoration: none; }
  main {
    flex: 1;
    padding: 16px;
    padding-bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom) + 12px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }

  .tabContainer {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .tabPanel {
    display: none;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }
  .tabPanel.active { display: flex; }

  .bottomNav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--border);
  }
  .tabBtn {
    min-height: 52px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .tabBtn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #052e1a;
  }

  .ctxCard {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px;
  }
  .ctxCard.warn { border-color: var(--warn); }
  .ctxCard.error { border-color: var(--error); }
  .ctxLine1 { font-weight: 600; font-size: 16px; }
  .ctxLine2 { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .ctxAge { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .ctxAge.stale { color: var(--warn); }

  .tagRow {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .tagBtn {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 8px; font-size: 14px; font-weight: 500;
    cursor: pointer; min-height: 56px;
  }
  .tagBtn.active {
    background: var(--accent); border-color: var(--accent);
    color: #052e1a;
  }

  .captureRow {
    margin-top: auto;
    display: flex; gap: 8px;
    position: sticky;
    bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom));
    padding-bottom: 4px;
    z-index: 5;
  }
  .captureBtn {
    flex: 1;
    background: var(--accent); color: #052e1a;
    border: none; border-radius: 14px;
    padding: 22px; font-size: 20px; font-weight: 700;
    min-height: 80px; cursor: pointer;
  }
  .captureBtn:disabled { background: var(--border); color: var(--muted); }
  .captureBtn:active { background: var(--accent-dark); }
  .galleryBtn {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 8px 10px; min-height: 80px;
    cursor: pointer; flex: 0 0 116px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; font-weight: 500; line-height: 1.2; text-align: center;
  }
  .galleryBtn .galleryIcon { font-size: 22px; line-height: 1; }
  .galleryBtn:disabled { color: var(--muted); }
  .galleryBtn:active { background: var(--border); }
  #fileInput, #galleryInput { display: none; }

  #uploads { display: flex; flex-direction: column; gap: 8px; }
  .upCard {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; position: relative;
    transition: border-color 0.3s, opacity 0.5s;
  }
  .upCard.success { border-color: var(--accent); }
  .upCard.error { border-color: var(--error); }
  .upCard .upHead {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; font-size: 13px;
  }
  .upCard .upTag {
    background: var(--border); color: var(--text);
    padding: 2px 8px; border-radius: 4px; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
  }
  .upCard.success .upTag { background: var(--accent); color: #052e1a; }
  .upCard .upStatus { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .upCard .upDismiss {
    background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .upCard .upBody {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 14px; white-space: pre-wrap; word-break: break-word;
    color: var(--text); margin-top: 4px;
  }
  .upCard .upRow { display: flex; gap: 10px; align-items: flex-start; margin-top: 4px; }
  .upCard .upThumb {
    flex: 0 0 56px; width: 56px; height: 56px;
    border-radius: 6px; background: var(--border);
    object-fit: cover; display: block;
  }
  .upCard .upBody { flex: 1; margin-top: 0; }
  .upCard.fading { opacity: 0; }

  /* Spinner */
  .spin {
    width: 12px; height: 12px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pendingBanner {
    background: var(--warn); color: #422006;
    padding: 10px 14px; border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 500;
  }
  .pendingBanner button {
    background: #422006; color: var(--warn);
    border: none; border-radius: 6px; padding: 6px 12px;
    font-weight: 600; cursor: pointer;
  }

  .confirmRow {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .confirmRow button {
    flex: 1; padding: 10px;
    background: var(--warn); color: #422006;
    border: none; border-radius: 6px; font-weight: 600;
  }
  .confirmRow button.cancel {
    background: var(--border); color: var(--text);
  }

  /* Setup screen */
  #setupScreen {
    display: none; flex-direction: column; gap: 12px; padding: 16px;
  }
  #setupScreen.show { display: flex; }
  #setupScreen label { font-size: 14px; color: var(--muted); }
  #setupScreen input {
    width: 100%; padding: 12px; font-size: 16px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
  }
  #setupScreen button {
    padding: 14px; background: var(--accent); color: #052e1a;
    border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
  }

  .hidden { display: none !important; }

  .recentBox { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  .recentHead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; cursor: pointer; user-select: none;
    font-size: 13px; color: var(--muted);
  }
  .recentHead .chev { transition: transform 0.15s; }
  .recentBox.open .recentHead .chev { transform: rotate(90deg); }
  .recentList { display: none; padding: 0 12px 10px; flex-direction: column; gap: 6px; }
  .recentBox.open .recentList { display: flex; }
  .recentItem {
    display: flex; gap: 8px; align-items: center;
    padding: 6px; border-top: 1px solid var(--border);
    text-decoration: none; color: var(--text);
  }
  .recentItem:first-child { border-top: none; }
  .recentItem .rTag {
    background: var(--border); padding: 2px 6px; border-radius: 4px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
    flex: 0 0 auto;
  }
  .recentItem .rText {
    flex: 1; font-size: 13px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recentItem .rText .rOcr { color: var(--muted); }
  .recentEmpty { padding: 4px 6px; color: var(--muted); font-size: 13px; }

  .panelCard {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .panelTitle {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 4px;
  }
  .panelSub {
    color: var(--muted);
    font-size: 14px;
  }
  .actionGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .actionBtn {
    min-height: 56px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .actionBtn:active {
    background: var(--border);
  }
  .actionBtn:disabled {
    opacity: 0.55;
    cursor: default;
  }
  .actionMsg, .partsMsg {
    color: var(--muted);
    font-size: 13px;
    min-height: 18px;
  }
  .actionQueueStatus {
    min-height: 48px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.28);
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
  }
  .actionQueueStatus.pending {
    border-color: var(--warn);
    color: var(--text);
  }
  .actionQueueStatus.online {
    border-color: var(--accent);
    color: var(--text);
  }
  .actionQueueStatus.warn {
    border-color: var(--warn);
    color: var(--warn);
  }
  .actionQueueStatus.error {
    border-color: var(--error);
    color: var(--text);
  }
  .actionQueueStatusDetail {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }
  .agentStatus {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(15, 23, 42, 0.28);
    color: var(--muted);
    font-size: 14px;
  }
  .agentStatus.online {
    border-color: var(--accent);
    color: var(--text);
  }
  .agentStatus.stale {
    border-color: var(--warn);
    color: var(--warn);
  }
  .agentStatus.error {
    border-color: var(--error);
    color: var(--text);
  }
  .agentStatusDetail {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }
  .partsSearch {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .partsResults {
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 10px;
    min-height: 140px;
    padding: 12px;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>SnapNinja</h1>
  <a href="#" id="setupLink">⚙️</a>
</header>

<main id="mainScreen">
  <div class="tabContainer">
    <section id="tabPhotos" class="tabPanel active">
      <div id="ctx" class="ctxCard">Loading job context…</div>

      <div>
        <div style="font-size:13px; color:var(--muted); margin-bottom:6px;">Tag</div>
        <div class="tagRow" id="tagRow">
          <button class="tagBtn active" data-tag="serial">Serial</button>
          <button class="tagBtn" data-tag="cup_count">Cup count</button>
          <button class="tagBtn" data-tag="part_code">Part code</button>
          <button class="tagBtn" data-tag="error">Error</button>
          <button class="tagBtn" data-tag="general">General</button>
        </div>
      </div>

      <div id="pending" class="hidden"></div>
      <div id="recent" class="recentBox hidden">
        <div class="recentHead">
          <span><span class="chev">▶</span> <span id="recentLabel">Recent photos for this job</span></span>
          <span id="recentCount" style="font-size:12px;"></span>
        </div>
        <div class="recentList" id="recentList"></div>
      </div>
      <div id="uploads"></div>

      <div class="captureRow">
        <button id="captureBtn" class="captureBtn">📷 Take Photo</button>
        <button id="galleryBtn" class="galleryBtn" aria-label="Upload from gallery">
          <span class="galleryIcon">🖼️</span>
          <span>Upload from Gallery</span>
        </button>
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <input type="file" id="galleryInput" accept="image/*">
    </section>

    <section id="tabActions" class="tabPanel">
      <div class="panelCard">
        <div class="panelTitle">Current Job</div>
        <div id="actionsJobSummary" class="panelSub">No active job</div>
      </div>
      <div class="panelCard">
        <div class="panelTitle">Tablet</div>
        <div id="tabletStatus" class="agentStatus">Tablet status: checking...</div>
      </div>
      <div class="actionGrid" id="actionGrid">
        <button class="actionBtn" data-command="travelStart">Travel start</button>
        <button class="actionBtn" data-command="onsite">On site</button>
        <button class="actionBtn" data-command="offsite">Off site</button>
        <button class="actionBtn" data-command="swmsNo">SWMS = No</button>
        <button class="actionBtn" data-command="electricalCertNo">Electrical Cert = No</button>
      </div>
      <div id="actionQueueStatus" class="actionQueueStatus"></div>
    </section>

    <section id="tabParts" class="tabPanel">
      <div class="panelCard">
        <div class="panelTitle">Parts Lookup</div>
        <div class="panelSub">Parts lookup not wired yet</div>
      </div>
      <input id="partsSearch" class="partsSearch" type="search" placeholder="Search part code or description">
      <div id="partsMsg" class="partsMsg"></div>
      <div id="partsResults" class="partsResults"></div>
    </section>
  </div>

  <nav class="bottomNav" aria-label="Primary">
    <button class="tabBtn active" data-tab="tabPhotos" type="button">Photos</button>
    <button class="tabBtn" data-tab="tabActions" type="button">Actions</button>
    <button class="tabBtn" data-tab="tabParts" type="button">Parts</button>
  </nav>
</main>

<section id="setupScreen">
  <h2 style="margin:0;">Setup</h2>
  <label>Apps Script Web App URL (ends in /exec)
    <input type="url" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
  </label>
  <label>Shared secret
    <input type="text" id="cfgSecret" placeholder="(matches SHARED_SECRET in Apps Script)">
  </label>
  <button id="cfgSave">Save</button>
  <button id="cfgCancel" style="background:var(--border); color:var(--text);">Cancel</button>
</section>

<script src="app.js?v=20260516e"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js?v=20260516e').catch(()=>{});
  }
</script>
</body>
</html>
